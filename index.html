/* Layout: full-screen side-on cross-section of the Earth. Smooth lit gradients for rock, crisp pixel sprites for objects. HUD on top, floating prompt panel, docked answer bar. Single committed dark look. */
:root{
  --panel:rgba(12,14,24,.86); --ink:#eef0f4; --dim:#9aa0b4; --lava:#ff7a3d; --gem:#6ee7f2; --gold:#ffd27a; --bad:#ff5a6a;
  --pix:"Departure Mono","Pixelify Sans","Courier New",monospace; --tiny:"Silkscreen","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#0c0e18;color:var(--ink);font-family:var(--pix);overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--gem);outline-offset:2px}
#stage{position:fixed;inset:0;transform-origin:22% 60%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#stage.zoom{transform:scale(1.035)}
#bg,#px{position:absolute;inset:0;width:100%;height:100%;display:block}
#px{image-rendering:pixelated;image-rendering:crisp-edges}
#vig{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#pulse{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;box-shadow:inset 0 0 220px 60px var(--pc,#fff)}
#pulse.on{animation:pulse 1.6s ease-out}
@keyframes pulse{0%{opacity:0}15%{opacity:.9}100%{opacity:0}}
#scan{position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(0,0,0,.035) 0 1px,transparent 1px 3px)}
#beat{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;box-shadow:inset 0 0 180px 40px rgba(255,60,80,.6)}
#beat.on{animation:beat .5s ease-out}
@keyframes beat{0%{opacity:.7}100%{opacity:0}}
.chamfer{clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
.ui{position:fixed;z-index:10}

#hud{top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:10px;padding-inline:16px;pointer-events:none}
.hbox{justify-self:start;background:var(--panel);padding:10px 16px 12px;min-width:130px;pointer-events:auto;backdrop-filter:blur(4px)}
.hbox .k{font-family:var(--tiny);font-size:10px;letter-spacing:.22em;color:var(--dim)}
.hbox .v{font-size:28px;line-height:1.05;color:var(--gem);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbox .v small{font-size:15px;color:var(--dim);margin-left:3px}
.hbox.right{justify-self:end;text-align:right}
.hbox.right .v{color:var(--lava);font-size:20px}
.hbox.right .v2{font-size:15px;color:var(--gold);font-variant-numeric:tabular-nums}
.prog{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:12px}
.pips{display:flex;gap:4px;background:var(--panel);padding:5px}
.pip{width:16px;height:16px;background:#262a3c;transition:background .5s}
.pip.cur{background:var(--lava);animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
.prog .lbl{font-family:var(--tiny);font-size:10px;letter-spacing:.22em;color:#d8dbe6;text-shadow:0 1px 2px #000}
.iconbtn{position:fixed;z-index:11;top:calc(env(safe-area-inset-top,0px) + 92px);width:44px;height:40px;background:rgba(40,44,62,.9);border:0;display:grid;place-items:center;font-size:16px}
#menuBtn{left:16px}#sndBtn{right:16px}
#menu{position:fixed;z-index:12;left:16px;top:calc(env(safe-area-inset-top,0px) + 138px);background:var(--panel);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:210px}
#menu button{background:#22263a;border:0;padding:10px 12px;text-align:left;font-size:16px}
#menu button:hover{background:#2e3350}

#panel{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 150px);width:min(680px,calc(100% - 32px));background:var(--panel);padding:20px 26px 22px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px);transition:opacity .3s}
#panel.dim{opacity:.35}
.eyebrow{font-family:var(--tiny);font-size:11px;letter-spacing:.3em;color:var(--lava);margin:0}
.q{font-size:clamp(26px,4.2vw,40px);font-weight:600;line-height:1.08;margin:0;text-wrap:balance}
.sub{font-family:var(--tiny);font-size:11px;letter-spacing:.12em;color:var(--dim);margin:0}
.res{display:flex;flex-direction:column;gap:8px}
.hit{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--tiny);font-size:11px;letter-spacing:.12em;padding:6px 9px;color:#0c0e18}
.ans{font-size:clamp(24px,3.6vw,32px);font-weight:600}
.plus{font-size:22px;color:var(--gold);font-variant-numeric:tabular-nums}
.say{margin:0;font-size:17px}
.deeper{margin:0;font-size:16px;color:var(--dim);line-height:1.35}
.deeper b{font-family:var(--tiny);font-weight:400;font-size:10px;letter-spacing:.1em;padding:2px 5px;color:#0c0e18;margin-right:6px;vertical-align:2px}
.small{font-family:var(--tiny);font-size:10px;letter-spacing:.14em;color:var(--dim);margin:0}

#bar{left:0;right:0;bottom:0;padding:28px 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:linear-gradient(180deg,transparent,rgba(8,9,16,.85) 45%);display:flex;justify-content:center}
.barin{width:min(820px,100%);display:flex;align-items:center;gap:12px}
.timer{position:relative;width:62px;height:62px;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:var(--gem);font-variant-numeric:tabular-nums}
.timer.low .t{color:var(--bad)}
.field{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
#ans{width:100%;background:rgba(8,9,16,.9);color:var(--ink);border:2px solid var(--gem);padding:14px 16px;font:500 22px var(--pix);outline:none;transition:border-color .2s}
#ans::placeholder{color:#5f6580}
#ans:disabled{opacity:.6}
#ans.nope{border-color:var(--bad);animation:nope .35s}
@keyframes nope{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.under{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:16px}
.tries{display:flex;gap:5px;align-items:center;font-family:var(--tiny);font-size:10px;color:var(--dim);letter-spacing:.1em}
.try{width:10px;height:10px;background:var(--gem)}
.try.used{background:#2e3350}
.msg{font-size:15px;color:var(--bad);text-align:right}
.pbtn{flex:none;background:var(--lava);color:#1a0d06;border:0;padding:16px 22px;font-family:var(--tiny);font-size:15px;letter-spacing:.2em}
.pbtn:active{transform:translateY(2px)}
.pbtn:disabled{opacity:.5}
.pbtn.cyan{background:var(--gem);color:#06262a}

#ruler{position:fixed;top:0;bottom:0;right:16px;width:150px;pointer-events:none;z-index:6}
.tick{position:absolute;right:0;display:flex;align-items:center;gap:6px;font-family:var(--tiny);font-size:9px;letter-spacing:.08em;color:rgba(255,255,255,.7);text-shadow:0 1px 2px #000;white-space:nowrap;transform:translateY(-50%)}
.tick::after{content:"";width:14px;height:1px;background:rgba(255,255,255,.6)}
.tick.sky{color:rgba(20,30,45,.7);text-shadow:none}.tick.sky::after{background:rgba(20,30,45,.7)}
#placs{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.plac{position:absolute;width:280px;padding:12px 16px 13px 30px;background:linear-gradient(90deg,rgba(8,9,16,0),rgba(8,9,16,.86) 22px,rgba(8,9,16,.86));border-top:1px dashed rgba(255,255,255,.16);font:16.5px/1.45 var(--pix);color:#eef0f4;text-shadow:0 1px 0 #000;transform:translateY(-50%);transition:opacity .4s}
.plac b{display:block;font-family:var(--pix);font-weight:400;font-size:11px;letter-spacing:.16em;color:var(--gold);margin-bottom:5px;text-transform:uppercase}
.plac::before{content:"";position:absolute;top:21px;width:22px;height:1px;background:rgba(255,210,122,.7)}
.plac.l::before{right:calc(100% - 8px)}.plac.r::before{left:100%}
#caption{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 20vh);transform:translateX(-50%);z-index:9;width:min(540px,calc(100% - 32px));padding:24px 10px;background:radial-gradient(ellipse at center,rgba(8,9,16,.42),rgba(8,9,16,0) 70%);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s}
#caption.on{opacity:1}
.cap-tier{font-family:var(--tiny);font-size:13px;letter-spacing:.34em;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.cap-name{font-weight:600;line-height:1;margin:10px 0 8px;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 40px var(--cc,#fff),0 2px 24px rgba(0,0,0,.6);text-wrap:balance}
.cap-km{font-size:24px;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.8);font-variant-numeric:tabular-nums}
.cap-rare{margin-top:14px;font-size:15px;color:#eef0f4;text-shadow:0 1px 2px #000,0 1px 10px rgba(0,0,0,.9)}
.cap-rare b{font-family:var(--tiny);font-weight:400;font-size:9px;letter-spacing:.14em;color:#0c0e18;padding:2px 5px;margin:0 6px 0 10px}

  if(S.phase==="ask"){
    panel.innerHTML=`<p class="eyebrow">PROMPT ${S.i+1} OF 7 · ${esc(p.cat.toUpperCase())}</p><h2 class="q">${esc(p.q)}</h2><p class="sub">▼ RARER ANSWERS DRILL DEEPER ▼ ${esc(p.h)}</p>`;
    bar.innerHTML=`<div class="timer" id="tmr"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="rgba(8,9,16,.9)" stroke="#262a3c" stroke-width="4"/><circle class="arc" cx="32" cy="32" r="28" fill="none" stroke="#6ee7f2" stroke-width="4" stroke-dasharray="176" stroke-dashoffset="0"/></svg><div class="t">${TLIM}</div></div>
      <form class="field" id="f" autocomplete="off"><input id="ans" type="text" placeholder="type one answer…" aria-label="Your answer" autocapitalize="off" spellcheck="false">
      <div class="under"><div class="tries">WRONG GUESSES ARE FREE · BEAT THE CLOCK</div><div class="msg" id="msg"></div></div></form>
      <button class="pbtn" id="go">DRILL</button>`;
    const inp=document.getElementById("ans");inp.focus({preventScroll:true});
    document.getElementById("f").onsubmit=e=>{e.preventDefault();guess(inp.value);};document.getElementById("go").onclick=()=>guess(inp.value);
    if(!timer.on||timer.forI!==S.i){timer={on:true,left:TLIM,last:performance.now(),sec:TLIM,forI:S.i};}
  }else if(S.phase==="reveal"){
    const r=S.results[S.i];const tier=r.ti==null?null:TIERS[r.ti];const deep=deeperList(p,r.ti);
    panel.hidden=true;showCaption(r,deep);
    if(false)panel.innerHTML=`<p class="eyebrow">PROMPT ${S.i+1} OF 7 · ${esc(p.q.toUpperCase())}</p>
      <div class="res"><div class="hit">${tier?`<span class="chip" style="background:${tier.c}">${tier.name.toUpperCase()}</span><span class="ans">${esc(r.name)}</span><span class="plus">+${tier.km.toLocaleString()} km</span>`:`<span class="chip" style="background:var(--bad)">${r.timeout?"TIME UP":"DRY HOLE"}</span><span class="plus">+0 km</span>`}</div>
      <p class="say">${tier?tier.say:"Nothing struck. The drill stays where it is."}</p>
      ${deep.map(d=>`<p class="deeper"><b style="background:${TIERS[d.t].c}">${TIERS[d.t].name.toUpperCase()}</b>${d.names.map(esc).join(", ")}</p>`).join("")}
      <p class="small">${p.idx.length} ANSWERS BURIED IN THIS PROMPT</p></div>`;
    bar.innerHTML=`<div class="row" style="justify-content:center;width:100%"><button class="pbtn" id="next">${S.i===6?"PULL THE CORE ▶":"NEXT PROMPT ▶"}</button></div>`;
    const nb=document.getElementById("next");nb.focus({preventScroll:true});nb.onclick=()=>{if(tween)return;SFX.click();S.i++;S.phase="ask";S.strikes=0;S.msg="";timer.on=false;save();render();};
  }
}
function showCaption(r,deep){const c=document.getElementById("caption");const tier=r.ti==null?null:TIERS[r.ti];
  const size=tier?["clamp(34px,5vw,48px)","clamp(40px,6vw,60px)","clamp(46px,7.5vw,74px)","clamp(52px,9vw,88px)","clamp(58px,11vw,108px)"][r.ti]:"clamp(34px,5vw,48px)";
  c.style.setProperty("--cc",tier?tier.c:"#ff5a6a");c.style.setProperty("--rd",tier?(1.4+r.ti*.5)+"s":"1s");
  c.innerHTML=`<div class="cap-tier" style="color:${tier?tier.c:"#ff5a6a"}">${tier?(tier.shout||tier.name.toUpperCase()):(r.timeout?"TIME UP":"DRY HOLE")}${tier&&tier.shout?" · "+tier.name.toUpperCase():""}</div>
    <div class="cap-name" style="font-size:${size}">${tier?esc(r.name):"Nothing struck"}</div>
    <div class="cap-km">${tier?"+"+tier.km.toLocaleString()+" km":"+0 km"}</div>
    ${deep.length?`<div class="cap-rare">Rarest: ${deep[0].names.slice(0,2).map(esc).join(", ")}</div>`:""}`;
  c.classList.remove("on");void c.offsetWidth;c.classList.add("on");}
function hideCaption(){document.getElementById("caption").classList.remove("on");}
function lev(a,b){if(a===b)return 0;const m=a.length,n2=b.length;let prev=Array.from({length:n2+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n2;j++){cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));}prev=cur;}return prev[n2];}
function suggest(p,raw){const n=norm(raw);if(n.length<3)return null;let best=null,bd=99;
  const tryKey=(a,k,q)=>{if(!k)return;let d;if(q.length>=4&&k.startsWith(q)&&k.length-q.length<=6)d=.5;else{if(Math.abs(k.length-q.length)>3)return;d=lev(q,k);const lim=k.length<=4?1:k.length<=8?2:3;if(d>lim)return;}if(d<bd){bd=d;best=a;}};
  for(const a of p.idx)for(const k of a.keys){tryKey(a,k,n);if(p.person){const last=n.split(" ").pop();if(last!==n)tryKey(a,k,last);}}
  return best;}
function guess(v){if(!v.trim()||S.phase!=="ask"||probing)return;audio();const p=P[S.order[S.i]];
  if(S.sug&&v===S.sugFor){const a=S.sug;S.sug=null;probe(a);return;}
  const a=lookup(p,v);if(a){S.sug=null;probe(a);return;}
  const sg=suggest(p,v);const msg=document.getElementById("msg");
  if(sg){S.sug=sg;S.sugFor=v;msg.innerHTML=`Did you mean <button type="button" class="sug" id="sugBtn">${esc(sg.name)}</button>? <span class="sugk">ENTER TO DRILL</span>`;msg.classList.add("hint2");
    document.getElementById("sugBtn").onclick=()=>{const x=S.sug;S.sug=null;if(x)probe(x);};tone(660,0,.12,{vol:.04,type:"triangle"});haptic(8);return;}
  S.sug=null;SFX.miss();msg.classList.remove("hint2");msg.textContent=`"${v.trim()}" isn't buried here. Try another.`;
  const inp=document.getElementById("ans");inp.value="";inp.classList.remove("nope");void inp.offsetWidth;inp.classList.add("nope");shake=3;burst(shownKm,"#7a7f96",8,2.5,"rock");}
// anticipation: the drill probes before the result. Rarer finds hold the silence longer.
function probe(a){probing=true;timer.on=false;const inp=document.getElementById("ans"),go=document.getElementById("go");inp.disabled=true;go.disabled=true;document.getElementById("panel").classList.add("dim");
  const wait=[650,700,800,1050,1500][a.ti];SFX.probe();if(a.ti>=3){duck(a.ti===4?0:.25,wait/1000);if(a.ti===4)document.getElementById("hush").classList.add("on");}
  if(a.ti>=2)SFX.riser(wait/1000);shake=1.5;setTimeout(()=>{probing=false;document.getElementById("hush").classList.remove("on");finish(a);},RM?50:wait);}
function finish(a,timeout){timer.on=false;const before=total();S.results[S.i]=a?{name:a.name,ti:a.ti}:{name:null,ti:null,timeout:!!timeout};S.phase="reveal";S.msg="";save();
  const after=total();render();
  if(!a){SFX.miss();return;}
  const ti=a.ti,tier=TIERS[ti];SFX.reveal(ti);
  if(false){const sh=document.getElementById("shout");sh.textContent=tier.shout;sh.style.color=tier.c;sh.style.fontSize=["","34px","clamp(40px,6vw,56px)","clamp(48px,8vw,76px)","clamp(56px,10vw,104px)"][ti];sh.style.setProperty("--sd",(1.4+ti*.4)+"s");sh.classList.remove("on");void sh.offsetWidth;sh.classList.add("on");}
  shake=[1,3,6,10,18][ti];
  if(ti>=2&&!RM){const pl=document.getElementById("pulse");pl.style.setProperty("--pc",tier.c);pl.classList.remove("on");void pl.offsetWidth;pl.classList.add("on");}
  if(ti>=3&&!RM){const st=document.getElementById("stage");st.classList.add("zoom");setTimeout(()=>st.classList.remove("zoom"),ti===4?3200:1600);}
  if(ti===4&&!RM){const f=document.getElementById("flash");f.classList.remove("on");void f.offsetWidth;f.classList.add("on");timeScale=.35;setTimeout(()=>timeScale=1,2600);}
  burst(before,tier.c,8+ti*12,2.5+ti*1.4,"rock");if(ti>=2)burst(before,"#ffffff",ti*12,3+ti,"spark");
  const dur=[700,1400,2400,3400,4800][ti];setTimeout(()=>SFX.descend(dur/1000,ti),ti>=3?350:100);
  setTimeout(()=>animateTo(after,dur,passed=>{SFX.land(ti);burst(after,tier.c,12+ti*10,2+ti,"spark");shake=Math.max(shake,2+ti*2);setNote(noteFor(after));renderHud();}),ti>=3?350:100);}
let toastTO=null;
const NOTES=[...FACTS.map(f=>({km:f.km,title:f.t+" down",fact:f.f})),...MILES.map(m=>({km:m.km,title:m.title,fact:m.fact,big:true}))].sort((a,b)=>a.km-b.km||(b.big?1:-1));
let noteKey=null;
function noteFor(km){let best=null;for(const x of NOTES){if(x.km<=km+1e-9)best=x;}return best||{km:0,title:"Surface · 0 km",fact:"Your rig sits on the grass. Every answer you land drives the drill deeper. Rare answers go furthest."};}
function setNote(m,force){const key=m.title;if(key===noteKey&&!force)return;noteKey=key;const t=document.getElementById("toast");
  document.getElementById("toastT").textContent=m.title;document.getElementById("toastP").textContent=m.fact;t.classList.toggle("big",!!m.big);
  t.classList.remove("on");void t.offsetWidth;t.classList.add("on");}
function showToast(m){setNote(m,true);}
function hideToast(){noteKey=null;}

function grade(d){return d>=CENTRE?["S","#ffd27a"]:d>=3000?["A","#6ee7f2"]:d>=1200?["B","#b99cff"]:d>=300?["C","#eadfc4"]:["D","#c9b08a"];}
function rankFor(d){return d>=CENTRE?"REACHED THE CENTRE OF THE EARTH":"REACHED THE "+BANDS[bandAt(d)].name.split(" · ")[0];}
function shareText(pct){const d=total();return `STRATA ${S.mode==="daily"?"#"+S.day:"FREE PLAY"} ⛏ ${fmtKm(d)} km · ${grade(d)[0]}${pct!=null?` · deeper than ${pct}%`:""}\n${S.results.map(r=>r.ti==null?"⬛":TIERS[r.ti].e).join("")}`;}
function bestFind(){let b=null;S.results.forEach((r,k)=>{if(r.ti!=null&&(!b||r.ti>b.ti))b={...r,k};});return b;}

/* ---------- personal stats (this browser) ---------- */
function loadStats(){return Object.assign({played:0,best:0,sum:0,streak:0,maxStreak:0,lastDay:0,tiers:[0,0,0,0,0],miss:0,done:{}},store.get("strata-stats")||{});}
function recordGame(){const st=loadStats();const key=S.mode==="daily"?"d"+S.day:null;if(key&&st.done[key])return st;const d=total();
  st.played++;st.sum+=d;st.best=Math.max(st.best,d);S.results.forEach(r=>r.ti==null?st.miss++:st.tiers[r.ti]++);
  if(key){st.done[key]=d;st.streak=st.lastDay===S.day-1?st.streak+1:1;st.lastDay=S.day;st.maxStreak=Math.max(st.maxStreak,st.streak);}
  store.set("strata-stats",st);return st;}

/* ---------- today's players: shared scores, or a model until enough people play ---------- */
let DB=null,UID=null,dbTried=false;
async function getDb(){if(dbTried)return DB;dbTried=true;try{if(!window.claude||!claude.use)return null;const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);if(!db||!user)return null;UID=await user.id();DB=db;}catch(e){DB=null;}return DB;}
async function submitScore(day,km){const db=await getDb();if(!db||!UID)return;try{const ref=db.doc("scores/"+UID);const snap=await ref.get();const body=snap.exists?{...snap.data()}:{};if(body["d"+day]!=null)return;body["d"+day]=km;await ref.set(body);}catch(e){}}
async function todaysScores(day){const db=await getDb();if(!db)return[];try{const q=await db.collection("scores").get();return q.docs.map(d=>d.data()?.["d"+day]).filter(v=>typeof v==="number");}catch(e){return[];}}
function modelScores(day){const r=rng(day*131+7);const probs=[.07,.48,.25,.12,.055,.025];const out=[];for(let i=0;i<4000;i++){let s=0;for(let k=0;k<7;k++){let u=r(),t=-1;for(let j=0;j<probs.length;j++){u-=probs[j];if(u<=0){t=j-1;break;}}if(t>=0)s+=TIERS[t].km;}out.push(s);}return out;}
function curveSVG(scores,you){const W0=640,H0=190,pad=18;const sorted=scores.slice().sort((a,b)=>a-b);const xmax=Math.max(you*1.15,sorted[Math.floor(sorted.length*.99)]||1,500);
  const bins=80,h=new Array(bins).fill(0);scores.forEach(v=>{h[Math.min(bins-1,Math.floor(v/xmax*bins))]++;});
  const sm=h.map((_,i)=>{let s=0,w=0;for(let k=-9;k<=9;k++){const j=i+k;if(j<0||j>=bins)continue;const g=Math.exp(-k*k/22);s+=h[j]*g;w+=g;}return s/w;});const mx=Math.max(...sm)||1;
  const X=v=>pad+(v/xmax)*(W0-pad*2),Yv=c=>H0-30-(c/mx)*(H0-60);
  const pts=sm.map((c,i)=>[X((i+.5)/bins*xmax),Yv(c)]);const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const yi=Math.min(bins-1,Math.floor(you/xmax*bins)),yx=X(you),yy=Yv(sm[yi]);
  const fill=line+` L ${X(xmax).toFixed(1)} ${H0-30} L ${pad} ${H0-30} Z`;const clipW=yx;
  const ticks=[0,.25,.5,.75,1].map(f=>{const v=f*xmax;return `<text x="${X(v)}" y="${H0-10}" text-anchor="middle">${fmtKm(Math.round(v/50)*50)}</text>`;}).join("");
  return `<svg viewBox="0 0 ${W0} ${H0}" class="curve" role="img" aria-label="Distribution of today's depths with your position">
    <defs><clipPath id="cl"><rect x="0" y="0" width="${clipW}" height="${H0}"/></clipPath></defs>
    <line x1="${pad}" y1="${H0-30}" x2="${W0-pad}" y2="${H0-30}" class="ax"/>
    <path d="${fill}" class="area" clip-path="url(#cl)"/><path d="${line}" class="ln"/>
    <line x1="${yx}" y1="${yy}" x2="${yx}" y2="${H0-30}" class="you"/><circle cx="${yx}" cy="${yy}" r="5" class="youdot"/>
    <text x="${yx}" y="${H0-36}" class="youlbl" text-anchor="${yx>W0-60?"end":yx<60?"start":"middle"}" dx="${yx>W0-60?-8:yx<60?8:0}">YOU</text>${ticks}</svg>`;}
function logSVG(){const W0=640,H0=250,top=34,row=40,cols=7;const X=k=>70+k*((W0-100)/(cols-1));
  const rows=TIERS.map((t,i)=>`<line x1="60" y1="${top+30+i*row}" x2="${W0-14}" y2="${top+30+i*row}" class="grid"/><text x="54" y="${top+34+i*row}" text-anchor="end" class="rl" fill="${t.c}">${t.name.toUpperCase()}</text>`).join("");
  const marks=S.results.map((r,k)=>{const x=X(k);if(r.ti==null)return `<g><text x="${x}" y="${top+6}" text-anchor="middle" class="miss">✕</text><title>${esc(P[S.order[k]].q)}: no answer</title></g>`;const y=top+30+r.ti*row,c=TIERS[r.ti].c;
    return `<g class="mk" style="animation-delay:${.2+k*.12}s"><line x1="${x}" y1="${top}" x2="${x}" y2="${y}" stroke="${c}" class="drop"/><rect x="${x-7}" y="${y-7}" width="14" height="14" transform="rotate(45 ${x} ${y})" fill="${c}" class="gem"/><title>${esc(P[S.order[k]].q)}: ${esc(r.name)} (${TIERS[r.ti].name})</title></g>`;}).join("");
  const nums=S.results.map((_,k)=>`<text x="${X(k)}" y="${H0-6}" text-anchor="middle" class="num">${k+1}</text>`).join("");
  return `<svg viewBox="0 0 ${W0} ${H0}" class="log" role="img" aria-label="Your seven answers by rarity"><line x1="60" y1="${top}" x2="${W0-14}" y2="${top}" class="surf"/><text x="54" y="${top+4}" text-anchor="end" class="rl">SURFACE</text>${rows}${marks}${nums}</svg>`;}
function showStats(){const st=recordGame();const d=total();const [g,gc]=grade(d);const b=bestFind();const el=document.getElementById("stats");
  el.innerHTML=`<div class="sw">
   <div class="sthead"><span class="eyebrow">${S.mode==="daily"?"DAILY DIG #"+S.day+" COMPLETE":"FREE PLAY COMPLETE"}</span><span class="grade" style="color:${gc}">${g}</span></div>
   <div class="big"><span class="bignum">${fmtKm(d)}</span><span class="bigu">km</span><span class="bigsub">${rankFor(d)}</span></div>
   <div id="curveBox"><div class="curvewait small">MEASURING TODAY'S DIGS…</div></div>
   <p class="pct" id="pct"></p><p class="small" id="pctNote"></p>
   ${b?`<div class="best"><span class="small">DEEPEST FIND</span><span class="chip" style="background:${TIERS[b.ti].c}">${TIERS[b.ti].name.toUpperCase()}</span><span class="ans">${esc(b.name)}</span></div>`:""}
   <h3 class="sec">DIG LOG <span>DEEPER = RARER</span></h3>${logSVG()}
   <div class="finds">${S.results.map((r,k)=>`<div><b>${k+1}</b><i style="background:${r.ti==null?"#2e3350":TIERS[r.ti].c}"></i><span>${r.name?esc(r.name):"—"}</span><em>${esc(P[S.order[k]].q.replace(/^Name (a|an) /i,""))}</em></div>`).join("")}</div>
   <h3 class="sec">YOUR RECORD</h3>
   <div class="kpis"><div><b>${st.played}</b><span>PLAYED</span></div><div><b>${st.streak}</b><span>DAY STREAK</span></div><div><b>${fmtKm(st.best)}</b><span>BEST KM</span></div><div><b>${fmtKm(st.played?st.sum/st.played:0)}</b><span>AVERAGE KM</span></div></div>
   <div class="tierbars">${TIERS.map((t,i)=>{const tot=st.tiers.reduce((a,c)=>a+c,0)+st.miss||1;return `<div><span style="color:${t.c}">${t.name.toUpperCase()}</span><i><s style="width:${(st.tiers[i]/tot*100).toFixed(1)}%;background:${t.c}"></s></i><b>${st.tiers[i]}</b></div>`;}).join("")}</div>
   <h3 class="sec">THE STRATA</h3>
   <div class="legend2">${TIERS.map(t=>`<div><i style="background:${t.c}"></i><b>+${t.km.toLocaleString()} km</b><span>${t.name}. ${esc(t.say)}</span></div>`).join("")}</div>
   <pre class="share" id="shareTxt">${esc(shareText())}</pre>
   <div class="row"><button class="pbtn" id="copy">COPY RESULT</button><button class="pbtn cyan" id="again">${S.mode==="daily"?"FREE PLAY":"DIG AGAIN"}</button></div>
   <p class="small" id="copyMsg">${S.mode==="daily"?"A NEW DAILY DIG UNLOCKS AT MIDNIGHT":""}</p></div>`;
  el.hidden=false;el.scrollTop=0;bindEnd();fillCurve(d);}
async function fillCurve(d){let scores=[],real=false;
  if(S.mode==="daily"){await submitScore(S.day,d);const live=await todaysScores(S.day);if(live.length>=15){scores=live;real=true;}}
  if(!real)scores=modelScores(S.mode==="daily"?S.day:dayNo());
  const below=scores.filter(v=>v<d).length,pct=Math.round(below/scores.length*100);
  const box=document.getElementById("curveBox");if(!box)return;box.innerHTML=curveSVG(scores,d);
  document.getElementById("pct").innerHTML=`DEEPER THAN <b>${pct}%</b> OF ${real?"TODAY'S DIGGERS":"PLAYERS"}`;
  document.getElementById("pctNote").textContent=real?`${scores.length} PLAYERS FINISHED TODAY'S DIG`:"ESTIMATED FROM ANSWER RARITY UNTIL ENOUGH PLAYERS FINISH TODAY'S DIG";
  document.getElementById("shareTxt").textContent=shareText(pct);S.pct=pct;}
function bindEnd(){const b=bestFind();SFX.end(b?b.ti:0);
  document.getElementById("copy").onclick=()=>{SFX.click();const t=shareText(S.pct);const m=document.getElementById("copyMsg");
    navigator.clipboard.writeText(t).then(()=>m.textContent="COPIED").catch(()=>{const r=document.createRange();r.selectNodeContents(document.getElementById("shareTxt"));const s=getSelection();s.removeAllRanges();s.addRange(r);m.textContent="TEXT SELECTED · COPY WITH YOUR KEYBOARD";});};
  document.getElementById("again").onclick=()=>{SFX.click();newGame("free");};}

/* ================= wiring ================= */
function begin(mode){audio();musicOn(PREF.music);SFX.click();const s=document.getElementById("start");if(s)s.remove();document.getElementById("panel").hidden=false;document.getElementById("bar").hidden=false;newGame(mode);depthMood(shownKm);}
document.getElementById("goDaily").onclick=()=>begin("daily");
document.getElementById("goFree").onclick=()=>begin("free");
const menu=document.getElementById("menu"),menuBtn=document.getElementById("menuBtn");
menuBtn.onclick=()=>{menu.hidden=!menu.hidden;menuBtn.setAttribute("aria-expanded",!menu.hidden);SFX.click();};
function pick(mode){menu.hidden=true;if(document.getElementById("start"))begin(mode);else{SFX.click();newGame(mode);}}
document.getElementById("mDaily").onclick=()=>pick("daily");document.getElementById("mFree").onclick=()=>pick("free");
const mMusic=document.getElementById("mMusic"),mHaptic=document.getElementById("mHaptic"),sndBtn=document.getElementById("sndBtn");
function syncPrefs(){mMusic.textContent="Music: "+(PREF.music?"on":"off");mHaptic.textContent="Vibration: "+(PREF.haptic?"on":"off");sndBtn.textContent=PREF.sound?"🔊":"🔇";sndBtn.setAttribute("aria-pressed",PREF.sound);sndBtn.setAttribute("aria-label",PREF.sound?"Sound on":"Sound off");
  if(A){A.master.gain.setTargetAtTime(PREF.sound?1:0,A.ctx.currentTime,.1);}}
mMusic.onclick=()=>{PREF.music=!PREF.music;store.set("strata-music",PREF.music);audio();musicOn(PREF.music);syncPrefs();};
mHaptic.onclick=()=>{PREF.haptic=!PREF.haptic;store.set("strata-haptic",PREF.haptic);syncPrefs();haptic(20);};
sndBtn.onclick=()=>{PREF.sound=!PREF.sound;store.set("strata-sound",PREF.sound);audio();syncPrefs();if(PREF.sound)SFX.click();};
document.getElementById("mHow").onclick=()=>{menu.hidden=true;showToast({title:"HOW TO PLAY",fact:"Seven prompts, one answer each, 30 seconds and 3 tries per prompt. Common answers barely scratch the surface. Rare answers drill you through the crust and mantle toward the centre of the Earth at 6,371 km."},1);};
syncPrefs();addEventListener("resize",resize);
S={mode:"daily",day:dayNo(),order:[0,1,2,3,4,5,6],i:0,results:[],phase:"ask"};
resize();renderHud();requestAnimationFrame(loop);
</script>
